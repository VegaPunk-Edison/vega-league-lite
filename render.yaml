services:
  - type: web
    name: vega-league
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/state
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_KEY
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
